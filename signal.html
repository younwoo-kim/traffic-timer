<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="신호등 타이머">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#b31217">

  <link rel="apple-touch-icon" href="icon.png">

  <title>신호등 타이머</title>

  <script>
    // ==================================================
    // 사용자 수정 영역
    // 나중에 시간이나 주기를 수정할 때는
    // 가급적 이 부분만 수정하면 됩니다.
    // ==================================================


    // --------------------------------------------------
    // 평일 설정 : 월요일 ~ 금요일
    // --------------------------------------------------

    // 매일 이 시각을 기준으로 주기 계산
    const WEEKDAY_BASE_TIME = "07:00:35";

    // 160초 = 2분 40초
    const WEEKDAY_CYCLE_SECONDS = 160;


    // --------------------------------------------------
    // 주말 설정 : 토요일 / 일요일
    // --------------------------------------------------

    // 토요일과 일요일 각각
    // 매일 00:00:40부터 새로 시작
    const WEEKEND_BASE_TIME = "00:00:40";

    // 140초 = 2분 20초
    const WEEKEND_CYCLE_SECONDS = 140;


    // --------------------------------------------------
    // 신호등 간 오프셋
    // --------------------------------------------------

    // 1번째 신호등 기준
    const SIGNAL_1_OFFSET = 0;

    // 2번째는 1번째보다 15초 뒤
    const SIGNAL_2_AFTER_SIGNAL_1 = 15;

    // 3번째는 2번째보다 40초 뒤
    const SIGNAL_3_AFTER_SIGNAL_2 = 40;


    // ==================================================
    // 내부 계산값
    // 아래 부분은 수정하지 않아도 됩니다.
    // ==================================================

    // 2번째 실제 누적 오프셋 = 15초
    const SIGNAL_2_OFFSET =
      SIGNAL_1_OFFSET +
      SIGNAL_2_AFTER_SIGNAL_1;

    // 3번째 실제 누적 오프셋 = 15 + 40 = 55초
    const SIGNAL_3_OFFSET =
      SIGNAL_2_OFFSET +
      SIGNAL_3_AFTER_SIGNAL_2;
  </script>


  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        sans-serif;

      min-height: 100vh;
      padding: 20px;
      color: white;

      transition:
        background 0.4s ease;

      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }


    /* 1번째 신호등 */
    body.mode-1 {
      background:
        linear-gradient(
          135deg,
          #b31217 0%,
          #5f0a87 100%
        );

      --countdown-color: #ffeb3b;
    }


    /* 2번째 신호등 */
    body.mode-2 {
      background:
        linear-gradient(
          135deg,
          #f7971e 0%,
          #ffd200 100%
        );

      --countdown-color: #3b2500;
    }


    /* 3번째 신호등 */
    body.mode-3 {
      background:
        linear-gradient(
          135deg,
          #2193b0 0%,
          #6dd5ed 100%
        );

      --countdown-color: #ffeb3b;
    }


    .container {
      max-width: 400px;
      margin: 0 auto;

      background:
        rgba(255, 255, 255, 0.12);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      border-radius: 20px;
      padding: 30px;

      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3);
    }


    h1 {
      text-align: center;

      margin-bottom: 10px;

      font-size: 28px;
      font-weight: 700;

      text-shadow:
        0 1px 3px rgba(0,0,0,0.35);
    }


    .mode-title {
      text-align: center;

      font-size: 18px;
      font-weight: 700;

      margin-bottom: 28px;

      color: #fff;

      text-shadow:
        0 1px 3px rgba(0,0,0,0.35);
    }


    .time-display {
      text-align: center;

      margin:
        20px 0 30px;
    }


    .current-time {
      font-size: 22px;
      font-weight: 700;

      margin-bottom: 20px;

      color: #fff;

      text-shadow:
        0 1px 3px rgba(0,0,0,0.35);
    }


    .next-signals {
      background:
        rgba(255,255,255,0.16);

      border-radius: 16px;

      padding: 20px;

      margin-top: 20px;
    }


    .signal-item {
      display: flex;

      justify-content: space-between;
      align-items: center;

      gap: 16px;

      padding: 15px 0;

      border-bottom:
        1px solid rgba(255,255,255,0.22);
    }


    .signal-item:last-child {
      border-bottom: none;
    }


    .signal-label {
      font-weight: 800;
      font-size: 16px;

      text-align: left;
      white-space: nowrap;

      text-shadow:
        0 1px 3px rgba(0,0,0,0.3);
    }


    .signal-value {
      text-align: right;

      min-width: 145px;
    }


    /* 남은 시간이 가장 중요하므로 크게 표시 */
    .signal-countdown-main {
      font-size: 22px;
      font-weight: 900;

      color:
        var(--countdown-color);

      text-shadow:
        0 1px 3px rgba(0,0,0,0.35);

      line-height: 1.2;
    }


    /* 실제 시각은 작게 표시 */
    .signal-time-sub {
      font-size: 14px;
      font-weight: 600;

      color:
        rgba(255,255,255,0.9);

      margin-top: 5px;

      text-shadow:
        0 1px 3px rgba(0,0,0,0.25);
    }


    .mode-buttons {
      display: grid;

      grid-template-columns:
        1fr 1fr 1fr;

      gap: 8px;

      margin-top: 16px;
    }


    button {
      width: 100%;

      padding: 12px;

      background:
        rgba(255, 255, 255, 0.22);

      color: white;

      border:
        2px solid rgba(255, 255, 255, 0.35);

      border-radius: 12px;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      transition:
        all 0.25s ease;

      text-shadow:
        0 1px 2px rgba(0,0,0,0.25);
    }


    button:active {
      transform:
        translateY(1px);
    }


    button.active {
      background:
        rgba(255, 255, 255, 0.62);

      border-color:
        rgba(255, 255, 255, 0.95);

      color: #222;

      box-shadow:
        0 0 18px rgba(255,255,255,0.45);

      text-shadow: none;
    }


    .version {
      margin-top: 18px;

      text-align: center;

      font-size: 12px;
      font-weight: 600;

      color:
        rgba(255,255,255,0.65);
    }
  </style>
</head>


<body class="mode-1">

  <div class="container">

    <h1>
      🚦 신호등 타이머
    </h1>


    <div
      class="mode-title"
      id="modeTitle">
      1번째 신호등
    </div>


    <div class="time-display">

      <div class="current-time">
        현재
        <span id="currentTime">
          --:--:--
        </span>
      </div>


      <div class="next-signals">

        <!-- 다음 신호 -->
        <div class="signal-item">

          <div class="signal-label">
            다음 신호
          </div>

          <div class="signal-value">

            <div
              class="signal-countdown-main"
              id="nextCountdown">
              --분 --초 후
            </div>

            <div
              class="signal-time-sub"
              id="nextSignal">
              --:--:--
            </div>

          </div>

        </div>


        <!-- 다다음 신호 -->
        <div class="signal-item">

          <div class="signal-label">
            다다음 신호
          </div>

          <div class="signal-value">

            <div
              class="signal-countdown-main"
              id="nextNextCountdown">
              --분 --초 후
            </div>

            <div
              class="signal-time-sub"
              id="nextNextSignal">
              --:--:--
            </div>

          </div>

        </div>

      </div>

    </div>


    <!-- 신호등 선택 -->
    <div class="mode-buttons">

      <button
        id="btnMode1"
        class="active">
        1번째
      </button>

      <button
        id="btnMode2">
        2번째
      </button>

      <button
        id="btnMode3">
        3번째
      </button>

    </div>


    <div class="version">
      v1.06
    </div>

  </div>


  <script>

    let timerInterval = null;

    let currentMode = 1;

    let offsetSeconds =
      SIGNAL_1_OFFSET;


    // ==================================================
    // 각 신호등 모드 설정
    // ==================================================

    const modeConfig = {

      1: {
        title: '1번째 신호등',
        offset: SIGNAL_1_OFFSET,
        bodyClass: 'mode-1'
      },

      2: {
        title: '2번째 신호등',
        offset: SIGNAL_2_OFFSET,
        bodyClass: 'mode-2'
      },

      3: {
        title: '3번째 신호등',
        offset: SIGNAL_3_OFFSET,
        bodyClass: 'mode-3'
      }

    };


    // ==================================================
    // 시작
    // ==================================================

    document.addEventListener(
      'DOMContentLoaded',
      () => {

        bindButtons();

        applyMode(1);

        updateTimer();


        /*
          250ms마다 다시 계산합니다.

          따라서 나중에 오프셋을
          15.5초 같은 식으로 입력해도
          계산상 반영할 수 있습니다.
        */
        timerInterval =
          setInterval(
            updateTimer,
            250
          );

      }
    );


    // 아이폰에서 앱을 다시 열었을 때
    // 즉시 최신 시각으로 갱신
    document.addEventListener(
      'visibilitychange',
      () => {

        if (!document.hidden) {
          updateTimer();
        }

      }
    );


    // Safari / 홈화면 웹앱 복귀 시 갱신
    window.addEventListener(
      'pageshow',
      () => {

        updateTimer();

      }
    );


    // ==================================================
    // 버튼
    // ==================================================

    function bindButtons() {

      document
        .getElementById('btnMode1')
        .addEventListener(
          'click',
          () => {

            applyMode(1);
            updateTimer();

          }
        );


      document
        .getElementById('btnMode2')
        .addEventListener(
          'click',
          () => {

            applyMode(2);
            updateTimer();

          }
        );


      document
        .getElementById('btnMode3')
        .addEventListener(
          'click',
          () => {

            applyMode(3);
            updateTimer();

          }
        );

    }


    // ==================================================
    // 신호등 모드 적용
    // ==================================================

    function applyMode(mode) {

      currentMode = mode;

      offsetSeconds =
        modeConfig[mode].offset;


      document.body.classList.remove(
        'mode-1',
        'mode-2',
        'mode-3'
      );


      document.body.classList.add(
        modeConfig[mode].bodyClass
      );


      document
        .getElementById('modeTitle')
        .textContent =
        modeConfig[mode].title;


      document
        .getElementById('btnMode1')
        .classList.toggle(
          'active',
          mode === 1
        );


      document
        .getElementById('btnMode2')
        .classList.toggle(
          'active',
          mode === 2
        );


      document
        .getElementById('btnMode3')
        .classList.toggle(
          'active',
          mode === 3
        );

    }


    // ==================================================
    // 오늘이 주말인지 판단
    //
    // JavaScript:
    // 일요일 = 0
    // 토요일 = 6
    // ==================================================

    function isWeekend(date) {

      const day =
        date.getDay();


      return (
        day === 0 ||
        day === 6
      );

    }


    // ==================================================
    // 해당 날짜의 기준 시각 생성
    // ==================================================

    function createTimeOnDate(
      date,
      timeText
    ) {

      const parts =
        timeText
          .split(':')
          .map(Number);


      const hours =
        parts[0] || 0;

      const minutes =
        parts[1] || 0;

      const seconds =
        parts[2] || 0;


      return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate(),
        hours,
        minutes,
        seconds,
        0
      );

    }


    // ==================================================
    // 특정 날짜의 신호 운영 설정
    //
    // 평일:
    // 그날 07:00:35 / 160초
    //
    // 토요일:
    // 그날 00:00:40 / 140초
    //
    // 일요일:
    // 그날 00:00:40 / 140초
    //
    // 핵심:
    // 일요일은 토요일 주기를 이어받지 않습니다.
    // ==================================================

    function getScheduleForDate(date) {

      if (isWeekend(date)) {

        return {

          baseTime:
            createTimeOnDate(
              date,
              WEEKEND_BASE_TIME
            ),

          cycleSeconds:
            WEEKEND_CYCLE_SECONDS

        };

      }


      return {

        baseTime:
          createTimeOnDate(
            date,
            WEEKDAY_BASE_TIME
          ),

        cycleSeconds:
          WEEKDAY_CYCLE_SECONDS

      };

    }


    // ==================================================
    // 다음날 00:00:00
    // ==================================================

    function getNextMidnight(date) {

      const nextDay =
        new Date(
          date.getFullYear(),
          date.getMonth(),
          date.getDate() + 1,
          0,
          0,
          0,
          0
        );


      return nextDay;

    }


    // ==================================================
    // 현재 시각 이후의
    // 가장 가까운 신호 시각 계산
    // ==================================================

    function getNextSignalTime(
      fromDate,
      offset
    ) {

      const schedule =
        getScheduleForDate(
          fromDate
        );


      /*
        신호등별 오프셋을
        그날의 기준 시각에 더합니다.
      */
      const adjustedBase =
        new Date(
          schedule.baseTime.getTime()
          +
          offset * 1000
        );


      const cycleMs =
        schedule.cycleSeconds
        * 1000;


      const elapsedMs =
        fromDate.getTime()
        -
        adjustedBase.getTime();


      let candidate;


      /*
        아직 오늘의 기준 신호보다
        현재 시간이 빠른 경우
      */
      if (elapsedMs <= 0) {

        candidate =
          adjustedBase;

      }

      /*
        이미 기준 시각을 지난 경우
      */
      else {

        const cycleIndex =
          Math.ceil(
            elapsedMs /
            cycleMs
          );


        candidate =
          new Date(
            adjustedBase.getTime()
            +
            cycleIndex * cycleMs
          );

      }


      /*
        계산된 신호가 다음날로 넘어갈 경우

        현재 날짜의 주기를 억지로
        다음날까지 이어가지 않고,

        다음날의 새로운 운영 기준으로
        다시 계산합니다.

        따라서:

        토요일 → 일요일
        일요일 → 월요일

        전환도 올바르게 처리됩니다.
      */
      const nextMidnight =
        getNextMidnight(
          fromDate
        );


      if (
        candidate.getTime()
        >=
        nextMidnight.getTime()
      ) {

        return getNextSignalTime(
          nextMidnight,
          offset
        );

      }


      return candidate;

    }


    // ==================================================
    // 화면 업데이트
    // ==================================================

    function updateTimer() {

      const now =
        new Date();


      document
        .getElementById(
          'currentTime'
        )
        .textContent =
        formatClockTime(
          now
        );


      // 다음 신호
      const nextSignalTime =
        getNextSignalTime(
          now,
          offsetSeconds
        );


      /*
        다다음 신호는
        방금 계산한 다음 신호보다
        아주 조금 뒤에서 다시 검색
      */
      const searchAfterNext =
        new Date(
          nextSignalTime.getTime()
          + 1
        );


      const nextNextSignalTime =
        getNextSignalTime(
          searchAfterNext,
          offsetSeconds
        );


      // 남은 초 계산
      const timeToNext =
        Math.max(
          0,
          Math.floor(
            (
              nextSignalTime.getTime()
              -
              now.getTime()
            )
            /
            1000
          )
        );


      const timeToNextNext =
        Math.max(
          0,
          Math.floor(
            (
              nextNextSignalTime.getTime()
              -
              now.getTime()
            )
            /
            1000
          )
        );


      // 다음 신호 남은 시간
      document
        .getElementById(
          'nextCountdown'
        )
        .textContent =
        formatRemainTime(
          timeToNext
        );


      // 다다음 신호 남은 시간
      document
        .getElementById(
          'nextNextCountdown'
        )
        .textContent =
        formatRemainTime(
          timeToNextNext
        );


      // 다음 신호 실제 시각
      document
        .getElementById(
          'nextSignal'
        )
        .textContent =
        formatClockTime(
          nextSignalTime
        );


      // 다다음 신호 실제 시각
      document
        .getElementById(
          'nextNextSignal'
        )
        .textContent =
        formatClockTime(
          nextNextSignalTime
        );

    }


    // ==================================================
    // 남은 시간 표시
    // ==================================================

    function formatRemainTime(
      totalSeconds
    ) {

      const safeSeconds =
        Math.max(
          0,
          totalSeconds
        );


      const minutes =
        Math.floor(
          safeSeconds / 60
        );


      const seconds =
        safeSeconds % 60;


      return (
        `${minutes}분 ${seconds}초 후`
      );

    }


    // ==================================================
    // HH:MM:SS 표시
    // ==================================================

    function formatClockTime(
      date
    ) {

      const hours =
        String(
          date.getHours()
        )
        .padStart(
          2,
          '0'
        );


      const minutes =
        String(
          date.getMinutes()
        )
        .padStart(
          2,
          '0'
        );


      const seconds =
        String(
          date.getSeconds()
        )
        .padStart(
          2,
          '0'
        );


      return (
        `${hours}:${minutes}:${seconds}`
      );

    }

  </script>

</body>
</html>
